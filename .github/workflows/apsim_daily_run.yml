name: Daily APSIM Database Update

# Trigger the workflow daily at 2:00 AM UTC, and allow manual triggering
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Ensure the GitHub Action has permission to push code back to your repo
permissions:
  contents: write

jobs:
  run-apsim:
    runs-on: ubuntu-latest # GitHub's free Linux server

    steps:
      # 1. Check out your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python for the weather script
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install required Python libraries
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # 4. Run your Python script to fetch Open-Meteo data and build the .met file
      - name: Update Weather Data (.met)
        run: python assets/scripts/update_weather.py

      # 5. Run the Simulation using your Custom Config via Docker
      # This pulls the official APSIM image and mounts your repository to /workspace inside the container
      - name: Run Custom Simulation Config
        run: docker run --rm -v "${{ github.workspace }}:/workspace" apsiminitiative/apsimng /workspace/assets/south_sumatra_oilpalm_seasonal_forecast.apsimx

      # 6. Commit the newly generated/updated .met and .db files back to GitHub
      - name: Commit and Push Updated Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add all updated databases and weather files in the assets folder
          git add assets/*.db
          git add assets/*.met
          # Fallback in case the met file was generated in the root directory
          git add *.met
          
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather and APSIM databases [skip ci]" && git push)
