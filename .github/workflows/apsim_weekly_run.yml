name: Weekly APSIM Seasonal Update

# Trigger weekly on Sunday at 2:00 AM UTC, or manually via API/dashboard
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-apsim-seasonal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # Run the long-term seasonal script
      - name: Update Seasonal Weather Data (.met)
        run: python assets/scripts/update_weather_seasonal.py

      # Run the Seasonal Simulation via Docker
      - name: Run Seasonal Simulation Config
        run: docker run --rm -v "${{ github.workspace }}:/workspace" apsiminitiative/apsimng /workspace/assets/south_sumatra_oilpalm_seasonal_forecast.apsimx

      # Commit files back to GitHub
      - name: Commit and Push Updated Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add assets/*.db
          git add assets/*.met
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Seasonal Weather and APSIM [skip ci]" && git push)
