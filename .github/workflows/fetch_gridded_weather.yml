name: Fetch Gridded Weather Data

on:
  workflow_dispatch:  # Allows manual triggering from the GitHub Actions UI
  # schedule:
  #   - cron: "0 0 * * *" # Optional: Runs every day at midnight UTC

jobs:
  fetch_weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Fetch Script
        run: |
          python assets/scripts/fetch_gridded_weather.py

      - name: Upload Gridded Met Files Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridded_met_files
          path: gridded_met_files/
          retention-days: 7
